<!-- ===========================================================================
     AI 유료계정 신청 블록 (GitHub Pages 삽입용) — PRD §7-1
     경상국립대학교 AI융합원
     사용법: 아래 블록 전체를 기존 페이지에 붙여 넣고, API_BASE 를 배포 주소로 바꾼다.
              백엔드 설정(settings.signup_origins)에 이 페이지의 오리진을 등록해야 한다.
     =========================================================================== -->
<div id="gnu-ai-signup">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css');
    #gnu-ai-signup { max-width: 720px; margin: 0 auto; font-family: 'Pretendard Variable', Pretendard, '맑은 고딕', 'Malgun Gothic', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.6; color: #20262c; }
    #gnu-ai-signup h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin: 28px 0 10px; color: #0b2b5c; }
    #gnu-ai-signup .step { border: 1px solid #e3e7ee; border-radius: 12px; padding: 20px; background: #fff; margin-bottom: 20px; }
    #gnu-ai-signup .step.disabled { opacity: .45; pointer-events: none; }
    #gnu-ai-signup label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
    #gnu-ai-signup input[type=text], #gnu-ai-signup input[type=email], #gnu-ai-signup select {
      width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; font-family: inherit; color: inherit; background: #fff; }
    #gnu-ai-signup input[type=text]:focus, #gnu-ai-signup input[type=email]:focus, #gnu-ai-signup select:focus {
      outline: none; border-color: #0098d8; box-shadow: 0 0 0 3px rgba(0,152,216,.3); }
    #gnu-ai-signup .row { display: flex; gap: 12px; flex-wrap: wrap; }
    #gnu-ai-signup .row > div { flex: 1 1 220px; }
    #gnu-ai-signup .btn { background: #0b2b5c; color: #fff; border: 0; border-radius: 6px; padding: 12px 20px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s; }
    #gnu-ai-signup .btn:hover { background: #081f44; }
    #gnu-ai-signup .btn:focus-visible { outline: 2px solid #0098d8; outline-offset: 2px; }
    #gnu-ai-signup .btn:disabled { opacity: .5; cursor: not-allowed; }
    #gnu-ai-signup .btn.secondary { background: #fff; color: #0b2b5c; border: 1px solid #0b2b5c; }
    #gnu-ai-signup .btn.secondary:hover { background: #e8f5fb; }
    #gnu-ai-signup .notice { background: #e8f5fb; border-radius: 8px; padding: 14px; font-size: 14px; line-height: 1.6; color: #20262c; }
    #gnu-ai-signup .check { font-size: 14px; display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-weight: 400; }
    #gnu-ai-signup .msg { font-size: 14px; margin-top: 10px; }
    #gnu-ai-signup .msg.err { color: #b91c1c; }
    #gnu-ai-signup .modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    #gnu-ai-signup .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 420px; width: 90%; }
  </style>

  <h3>STEP 1. GNU AI 윤리가이드라인 시청 (필수)</h3>
  <div class="step">
    <p style="font-size:13px;color:#475569;margin:0 0 10px">
      신청 전 반드시 윤리가이드라인 영상을 시청해 주세요. 「영상 보기」를 누르면 새 창으로 연결됩니다.
    </p>
    <button type="button" class="btn secondary" id="gnu-edu-btn">영상 보기</button>
    <label class="check">
      <input type="checkbox" id="gnu-edu-watched" />
      <span>윤리가이드라인 영상 시청을 완료했습니다.</span>
    </label>
  </div>

  <h3>STEP 2. AI 유료계정 신청</h3>
  <div class="step disabled" id="gnu-step2">
    <div class="row">
      <div>
        <label for="gnu-program">프로그램 <span style="color:#b91c1c">*</span></label>
        <select id="gnu-program"></select>
        <p style="font-size:12px;color:#64748b;margin:6px 0 0" id="gnu-period">대여기간: -</p>
      </div>
      <div>
        <label for="gnu-type">구분 <span style="color:#b91c1c">*</span></label>
        <select id="gnu-type">
          <option value="">선택</option>
          <option>교원</option><option>직원</option><option>학생</option><option>지역민</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label for="gnu-name">이름 <span style="color:#b91c1c">*</span></label><input type="text" id="gnu-name" /></div>
      <div><label for="gnu-affil">소속 <span style="color:#b91c1c">*</span></label><input type="text" id="gnu-affil" /></div>
    </div>
    <div class="row">
      <div><label for="gnu-email">이메일 <span style="color:#b91c1c">*</span></label><input type="email" id="gnu-email" placeholder="담당자 안내를 받을 주소" /></div>
      <div><label for="gnu-phone">연락처</label><input type="text" id="gnu-phone" /></div>
    </div>
    <div class="row">
      <div>
        <label for="gnu-service">희망 서비스</label>
        <select id="gnu-service"><option value="무관">무관</option><option value="GPT">ChatGPT Team</option><option value="Claude">Claude Team</option></select>
      </div>
      <div>
        <label for="gnu-haspaid">기존 유료계정 보유</label>
        <select id="gnu-haspaid"><option value="false">미보유</option><option value="true">보유</option></select>
      </div>
    </div>

    <label style="margin-top:16px">개인정보 수집·이용 동의 <span style="color:#b91c1c">*</span></label>
    <div class="notice" id="gnu-privacy-notice">불러오는 중…</div>
    <label class="check"><input type="checkbox" id="gnu-privacy" /><span>위 내용에 동의합니다.</span></label>

    <label style="margin-top:16px">이용 서약 <span style="color:#b91c1c">*</span></label>
    <div class="notice">
      · 배정받은 계정은 본인만 사용하며 타인에게 공유하지 않습니다.<br />
      · 개인정보·미공개 연구자료·내부 문서를 입력하지 않습니다.<br />
      · GNU AI 윤리가이드라인을 준수하며, 대여 종료 시 회수 절차에 협조합니다.
    </div>
    <label class="check"><input type="checkbox" id="gnu-pledge" /><span>위 서약에 동의합니다.</span></label>

    <!-- honeypot (사람에게는 보이지 않음) -->
    <input type="text" id="gnu-website" name="website" style="position:absolute;left:-9999px" tabindex="-1" autocomplete="off" />

    <p class="notice" style="margin-top:16px">
      승인·배정 후 담당자가 입력하신 이메일로 팀 워크스페이스 초대를 보냅니다. 접수번호를 보관해 주세요.
    </p>

    <div style="margin-top:16px"><button type="button" class="btn" id="gnu-submit">신청하기</button></div>
    <div class="msg" id="gnu-msg"></div>
  </div>
</div>

<script>
(function () {
  // ★ 배포 주소로 교체 (기존 Apps Script WEBAPP_URL 대체)
  var API_BASE = 'https://ai-account-concierge.vercel.app';

  var EDU_URL_DEFAULT = 'https://www.youtube.com/watch?v=XzMC4jGM_P0&t=2s';
  // 신청 페이지 고정 24개 (PRD §9-1). 표시 문구는 백엔드 응답(open/label)이 결정:
  //   시작전 → 「접수 준비 중」, 진행중 → 「접수중」(선택 가능),
  //   완료 → 「접수 종료」, 백엔드에 없으면 「미등록」.
  var GROUPS = [
    ['학생교육', ['초·중급 온라인 특강 2차','초·중급 온라인 특강 3차','초·중급 온라인 특강 4차','중·고급 GNU AI Pioneer','중급 프로젝트 중심 AI 활용 캠프','고급 프로젝트 중심 AI 활용 캠프','중·고급 워크숍 2차','중·고급 워크숍 3차']],
    ['교원교육', ['초·중·고급 AI활용 연구모임 운영','AXIS 인증 교수법 워크숍']],
    ['직원교육', ['초급 업무 효율화 기초 외 교육 2차','중급 교육과정','고급 교육과정','초급 온라인 교육과정','중·고급 워크숍(2회~3회)']],
    ['윤리교육', ['AI 윤리교육(인증)','AI활용 윤리']],
    ['재직자교육', ['중·고급 GNU AI 노바투스 아카데미아 프로그램','초·중급 RAG 기반 리더십 AI 활용 교육','초급 산업체 재직자 AI 교육(TP 협업)','공공기관 대상 AI활용 교육']],
    ['지역민교육', ['초·중급 생성형 AI 활용 교육 서비스를 위한 강사 양성','초·중급 교육청 연계 ROBLOX 기반 AI 활용 교육','초·중급 정보 소외 계층 대상 맞춤형 AI 활용 교육']]
  ];

  var $ = function (id) { return document.getElementById(id); };
  var open = {};   // 프로그램명 → {id, open, label, period, ...} (API 응답 항목)
  var eduUrl = EDU_URL_DEFAULT;

  function buildOptions() {
    var sel = $('gnu-program');
    sel.innerHTML = '<option value="">프로그램을 선택하세요</option>';
    GROUPS.forEach(function (g) {
      var og = document.createElement('optgroup');
      og.label = g[0];
      g[1].forEach(function (name) {
        var o = document.createElement('option');
        var info = open[name];
        o.value = name;
        var ok = !!(info && info.open);
        o.textContent = name + ' — ' + (info ? info.label : '미등록');
        o.disabled = !ok;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  }

  fetch(API_BASE + '/api/public/programs')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok) return;
      eduUrl = d.eduUrl || EDU_URL_DEFAULT;
      (d.programs || []).forEach(function (p) { open[p.name] = p; });
      buildOptions();
      if (d.privacy) {
        $('gnu-privacy-notice').innerHTML =
          '· 수집 항목: ' + d.privacy.items + '<br />· 이용 목적: ' + d.privacy.purpose +
          '<br />· 보유 기간: ' + d.privacy.period +
          '<br />· 동의를 거부할 수 있으나, 거부 시 계정 배정이 제한됩니다.';
      }
    })
    .catch(function () { buildOptions(); });

  buildOptions();

  $('gnu-edu-btn').addEventListener('click', function () { window.open(eduUrl, '_blank', 'noopener'); });

  $('gnu-edu-watched').addEventListener('change', function () {
    $('gnu-step2').className = this.checked ? 'step' : 'step disabled';
  });

  $('gnu-program').addEventListener('change', function () {
    var info = open[this.value];
    $('gnu-period').textContent = '대여기간: ' + (info && info.open ? info.period : '-');
  });

  function popup(html) {
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal">' + html + '<div style="margin-top:16px;text-align:right"><button class="btn" id="gnu-close">확인</button></div></div>';
    document.getElementById('gnu-ai-signup').appendChild(bg);
    bg.querySelector('#gnu-close').addEventListener('click', function () { bg.remove(); });
  }

  $('gnu-submit').addEventListener('click', function () {
    var msg = $('gnu-msg');
    msg.className = 'msg';
    msg.textContent = '';

    var payload = {
      programName: $('gnu-program').value,
      name: $('gnu-name').value.trim(),
      affiliation: $('gnu-affil').value.trim(),
      type: $('gnu-type').value,
      email: $('gnu-email').value.trim(),
      phone: $('gnu-phone').value.trim(),
      service: $('gnu-service').value,
      hasPaid: $('gnu-haspaid').value === 'true',
      eduWatched: $('gnu-edu-watched').checked,
      privacy: $('gnu-privacy').checked,
      pledge: $('gnu-pledge').checked,
      eduWatchedAt: new Date().toISOString(),
      website: $('gnu-website').value
    };

    if (!payload.programName) { msg.className = 'msg err'; msg.textContent = '프로그램을 선택해 주세요.'; return; }
    if (!payload.name || !payload.affiliation || !payload.type || !payload.email) {
      msg.className = 'msg err'; msg.textContent = '이름·소속·구분·이메일은 필수입니다.'; return;
    }
    if (!payload.privacy || !payload.pledge) { msg.className = 'msg err'; msg.textContent = '개인정보 동의와 이용 서약에 체크해 주세요.'; return; }

    var email = payload.email;
    var btn = $('gnu-submit');
    btn.disabled = true;
    btn.textContent = '접수 중…';

    fetch(API_BASE + '/api/public/apply', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        btn.disabled = false;
        btn.textContent = '신청하기';
        if (!d.ok) { msg.className = 'msg err'; msg.textContent = d.msg || '접수에 실패했습니다.'; return; }

        // 입력 내역 전부 삭제 (PRD §7-1)
        ['gnu-name','gnu-affil','gnu-email','gnu-phone'].forEach(function (id) { $(id).value = ''; });
        $('gnu-program').value = ''; $('gnu-type').value = ''; $('gnu-service').value = '무관';
        $('gnu-haspaid').value = 'false'; $('gnu-privacy').checked = false; $('gnu-pledge').checked = false;
        $('gnu-edu-watched').checked = false; $('gnu-step2').className = 'step disabled';
        $('gnu-period').textContent = '대여기간: -';

        popup(
          '<h3 style="margin:0 0 8px;color:#0b2b5c">신청이 접수되었습니다.</h3>' +
          '<p style="font-size:14px;line-height:1.7;margin:0">' +
          '접수번호: <strong>' + d.id + '</strong><br />대여기간: ' + (d.period || '-') + '<br />' +
          '연락 이메일: <strong>' + email + '</strong><br /><br />' +
          '관리자 승인·배정이 끝나면 입력하신 이메일로 팀 워크스페이스 초대 메일이 갑니다. 접수번호를 꼭 보관해 주세요.</p>'
        );
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = '신청하기';
        msg.className = 'msg err';
        msg.textContent = '네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.';
      });
  });
})();
</script>

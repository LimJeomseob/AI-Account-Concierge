# CI — 타입 검사·단위 테스트·빌드 (PR·push 마다)
# 실 DB 통합 테스트(test:acceptance)는 시범 DB 가 필요해 여기서 돌리지 않는다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npx tsc --noEmit
      - name: 단위 테스트
        run: npx vitest run
      - name: 빌드 (더미 환경변수)
        run: npm run build
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: dummy
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
          APP_SECRET: dummy
          CRON_SECRET: dummy

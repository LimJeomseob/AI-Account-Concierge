# AI 유료계정 관리시스템 — 앱 스택 (app + cron + caddy)
#
# 전제: Supabase 셀프호스팅 스택이 ../supabase-project 에서 먼저 떠 있어야 한다.
#       (docs/Docker배포가이드.md PART A-3 / B-2)
#       이 스택은 그 네트워크(supabase_default)에 붙어 kong:8000 으로 DB·Auth 에 접근한다.
#
# 로컬:   docker compose --env-file .env up -d --build
# 서버:   docker compose --env-file .env --profile server up -d --build   (Caddy HTTPS 포함)
#
# 이 파일은 docker/ 디렉터리에서 실행한다.

name: ai-account

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        SUPABASE_URL: ${SUPABASE_URL:-http://kong:8000}
    image: ai-account-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # 서버 쪽 DB 접근은 내부망(Kong)으로. 브라우저용 NEXT_PUBLIC_SUPABASE_URL 과 다른 값이어야 한다.
      SUPABASE_URL: ${SUPABASE_URL:-http://kong:8000}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - default
      - supabase
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cron:
    build: ./cron
    image: ai-account-cron:latest
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
      TZ: Asia/Seoul
    depends_on:
      app:
        condition: service_healthy
    networks:
      - default

  caddy:
    image: caddy:2-alpine
    profiles: ["server"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - default
      - supabase

networks:
  default:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_default}

volumes:
  caddy_data:
  caddy_config:
